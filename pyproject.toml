[project]
name = "tiebreaker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "litestar[sqlalchemy,standard]>=2.24.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:The declarative_mixin decorator:sqlalchemy.exc.SADeprecationWarning",
]
